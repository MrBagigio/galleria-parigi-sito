<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f0e8">
<title>Archivio di Eli</title>
<link rel="icon" href="icona.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap">
<style>
  :root { --bg: #f5f0e8; --ink: #26201a; --muto: #8a7d6f; --linea: #d8cdbd; --noce: #7a4f30; --no: #a14a3b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 300 16px/1.6 "Jost", system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  }
  main { width: 100%; max-width: 420px; text-align: center; animation: entra 1.2s cubic-bezier(.16,.84,.3,1); }
  @keyframes entra { from { opacity: 0; transform: translateY(16px); } }
  .occhiello { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--muto); margin: 0 0 18px; }
  h1 { font: 300 clamp(40px, 11vw, 60px)/1 "Cormorant Garamond", Garamond, serif; letter-spacing: -.015em; margin: 0; }
  h1 em { display: block; font-style: italic; color: var(--noce); }
  .riga { width: 40px; height: 1px; background: var(--linea); margin: 34px auto; }
  p.testo { color: var(--muto); font-size: 14px; margin: 0 0 26px; }
  form { display: grid; gap: 14px; }
  input[type=password], input[type=text] {
    width: 100%; font: 400 17px "Jost", system-ui, sans-serif; letter-spacing: .06em; text-align: center; color: var(--ink);
    padding: 14px 16px; border: 0; border-bottom: 1px solid var(--linea); background: transparent; border-radius: 0;
    outline: none; transition: border-color .3s;
  }
  input:focus { border-bottom-color: var(--ink); }
  label.ricorda { display: inline-flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: var(--muto); cursor: pointer; }
  label.ricorda input { width: 16px; height: 16px; accent-color: var(--noce); }
  button {
    font: 400 12px "Jost", system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--bg); background: var(--ink);
    border: 0; border-radius: 999px; min-height: 52px; cursor: pointer; transition: background .3s, opacity .3s;
  }
  button:hover { background: var(--noce); }
  button[disabled] { opacity: .5; }
  .errore { color: var(--no); font-size: 14px; min-height: 22px; margin: 0; }
  .scossa { animation: scossa .4s; }
  @keyframes scossa { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  noscript p { color: var(--no); }
</style>
</head>
<body>
<main id="m">
  <h1>Eli, ben tornata</h1>
  <div class="riga"></div>
  <form id="f" autocomplete="on">
    <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Password" required autofocus autocapitalize="none" autocorrect="off" spellcheck="false">
    <label class="ricorda"><input type="checkbox" id="ricorda" checked> Ricordami</label>
    <button id="b" type="submit">Entra</button>
    <p class="errore" id="e" role="alert"></p>
  </form>
  <noscript><p>Per vedere la raccolta serve JavaScript attivo.</p></noscript>
</main>

  const CHIAVE_LS = "galleria-chiave-" + C.sale.slice(0, 12);
  const da64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const a64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  async function chiaveDa(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: da64(C.sale), iterations: C.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function apri(chiave, ricorda) {
    const testo = await crypto.subtle.decrypt({ name: "AES-GCM", iv: da64(C.iv) }, chiave, da64(C.dati));
    const pagina = new TextDecoder().decode(testo);
    // la chiave si ricorda solo se ha davvero aperto la pagina
    if (ricorda) { try { localStorage.setItem(CHIAVE_LS, a64(await crypto.subtle.exportKey("raw", chiave))); } catch (_) {} }
    document.open(); document.write(pagina); document.close();
  }
  (async () => {  // chiave ricordata su questo dispositivo: si entra senza password
    try {
      const salvata = localStorage.getItem(CHIAVE_LS);
      if (salvata) await apri(await crypto.subtle.importKey("raw", da64(salvata), "AES-GCM", true, ["decrypt"]));
    } catch (_) { try { localStorage.removeItem(CHIAVE_LS); } catch (_) {} }
  })();
  const f = document.getElementById("f"), e = document.getElementById("e"), b = document.getElementById("b");
  f.addEventListener("submit", async ev => {
    ev.preventDefault();
    e.textContent = ""; b.disabled = true; b.textContent = "Apertura…";
    try {
      const k = await chiaveDa(document.getElementById("pw").value.trim().toLowerCase());
      await apri(k, document.getElementById("ricorda").checked);
    } catch (_) {
      b.disabled = false; b.textContent = "Entra";
      e.textContent = "Password sbagliata.";
      const m = document.getElementById("m"); m.classList.remove("scossa"); void m.offsetWidth; m.classList.add("scossa");
    }
  });
})();
